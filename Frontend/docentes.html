<!-- Página para administrar docentes mediante un formulario y una tabla. -->
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración visual y carga diferida de los scripts de la página. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="JS/storage.js" defer></script>
    <script src="JS/ui.js" defer></script>
    <script src="JS/docentes.js" defer></script>

    <title>SGA-DOCENTES</title>
</head>

<body>
    <!-- Navegación para cambiar entre los módulos del sistema. -->
    <header>
        <h1>Sistema de Gestión Académica</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html" class="activo">Docentes</a>
        </nav>
    </header>
    <main>
        <!-- El formulario permite crear o actualizar un docente. -->
        <section class="formulario-container">
            <h2>Alta de Docente</h2>

            <form id="formDocente">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre">
                </div>
                <div class="campo">
                    <label for="especialidad">Especialidad</label>
                    <input type="text" id="especialidad">
                </div>
                <div class="campo">
                    <label for="correo">Correo Electronico</label>
                    <input type="email" id="correo">
                </div>
                <div class="acciones-form">
                    <button type="submit">Confirmar Docente</button>
                </div>
            </form>
        </section>

        <!-- docentes.js genera aquí las filas con los datos guardados. -->
        <section class="lista-container">

            <h2>Docentes registrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaDocentes"></tbody>
            </table>
        </section>
        <p id="mensaje" class="mensaje"></p>
    </main>
</body>

</html>
