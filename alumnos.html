<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="JS/alumnos.js" defer></script>
    <script src="JS/ui.js" defer></script>
    <script src="JS/storage.js" defer></script>
    <title>SGA-ALUMNOS</title>
</head>

<body>
    <header>
        <h1>Sistema de de Alumnos </h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html">Docentes</a>
        </nav>
    </header>
    <main>
        <section class="formulario-containter">
            <h2>Alta de Alumno</h2>


            <form id="formulario">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre">
                </div>
                <div class="campo">

                    <label for="carrera">Carrera</label>
                    <input type="text" id="carrera">
                </div>
                <div class="campo">
                    <label for="correo">Correo Electronico</label>
                    <input type="email" id="correo">
                </div>

                <button type="submit">Confirmar Alumno</button>

            </form>

        </section>
        <section class="lista-container">

            <h2>Alumnos registrados</h2>
            <!-- <p id="cantidadAlumno"></p> -->

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Carrera</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaAlumnos"></tbody>
            </table>
        </section>
        <div id="mensaje" class="mensaje"></div>
    </main>
</body>

</html>
